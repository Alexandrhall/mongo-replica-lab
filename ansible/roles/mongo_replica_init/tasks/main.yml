---
# Installerar Docker på en färsk nod och startar MongoDB-containern med replSetName satt.
# rs.initiate() själv körs separat i playbooks/init_replica_set.yml (en gång, från en nod),
# den här rollen gör bara varje nod redo att gå med i ett replica set.

- name: "[{{ inventory_hostname }}] Vänta tills SSH svarar"
  ansible.builtin.wait_for_connection:
    timeout: 300

# cloud-init kör apt (package_update + qemu-guest-agent) vid första boot och håller dpkg-låset.
- name: "[{{ inventory_hostname }}] Vänta tills cloud-init är klar (annars krockar apt-låset)"
  ansible.builtin.command: cloud-init status --wait
  register: cloud_init_status
  changed_when: false
  failed_when: cloud_init_status.rc not in [0, 2] # 2 = klar men med ofarliga varningar

- name: "[{{ inventory_hostname }}] Installera Docker (docker.io från Ubuntu) och python3-docker för Ansible-modulerna"
  ansible.builtin.apt:
    name:
      - docker.io
      - python3-docker
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "[{{ inventory_hostname }}] Se till att docker är igång och startar vid boot"
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: "[{{ inventory_hostname }}] Skapa data- och configkatalog för MongoDB"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ mongo_data_dir }}"
    - "{{ mongo_config_dir }}"

# Kör om rollen mot ett redan uppgraderat kluster ska INTE nedgradera: behåll befintlig image om
# containern redan finns, använd annars initial-versionen.
- name: "[{{ inventory_hostname }}] Kolla om mongo-containern redan finns"
  community.docker.docker_container_info:
    name: "{{ mongo_container_name }}"
  register: mongo_container_info

- name: "[{{ inventory_hostname }}] Starta mongo-containern"
  ansible.builtin.include_tasks: container.yml
  vars:
    mongo_image: >-
      {{ mongo_container_info.container.Config.Image
         if mongo_container_info.exists
         else 'mongo:' ~ mongodb_initial_version }}

# En öppen port betyder inte att mongod tar emot kommandon - vänta på ett riktigt svar, annars
# kan checken "redan med i ett replica set" i init_replica_set.yml misslyckas och köra rs.initiate()
# på ett redan initierat set. Samma väntan som upgrade-rollen använder.
- name: "[{{ inventory_hostname }}] Vänta tills mongod svarar"
  ansible.builtin.include_role:
    name: mongo_upgrade_node
    tasks_from: wait_for_mongod_ready.yml
