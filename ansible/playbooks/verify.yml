---
# Kontrollerar att testdatan från seed.yml finns kvar OCH är identisk på varje nod som kör.
# Läser direkt från varje nod (även secondaries), jämför varje dokument mot det seed genererar och
# kontrollerar index. Noder som är nere hoppas över (och rapporteras). Ändrar ingenting.
#
#   ansible-playbook playbooks/verify.yml
#   ansible-playbook playbooks/verify.yml -e seed_docs_per_collection=50   # om du seedat fler dokument
- name: Kontrollera testdatan på varje nod
  hosts: mongo_replica
  gather_facts: false
  tasks:
    - ansible.builtin.include_tasks: tasks/detect_running.yml

    # Direktanslutning till noden själv: containern kör network_mode: host och mongod binder 127.0.0.1,
    # så 127.0.0.1:27017 inifrån containern är nodens egen mongod.
    - name: "[{{ inventory_hostname }}] Jämför data mot förväntad testdata (väntar om noden är på väg ikapp)"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ mongo_container_name }}"
          - sh
          - -c
          - "{{ mongo_sh_script }}"
          - sh
          - --quiet
          - "mongodb://127.0.0.1:{{ mongo_port }}/{{ seed_db }}?readPreference=secondaryPreferred"
          - --eval
          - "var CFG = {{ seed_cfg }};\n{{ lookup('file', 'testdata.js') }}\n{{ lookup('file', 'verify.js') }}"
      register: verify_out
      until: verify_out.rc == 0 and (verify_out.stdout | trim | from_json).ok
      retries: 20
      delay: 3
      changed_when: false
      failed_when: false
      when: node_running

    - name: "[{{ inventory_hostname }}] Spara resultatet"
      ansible.builtin.set_fact:
        verify_result: "{{ (verify_out.stdout | trim | from_json) if (node_running and verify_out.rc | default(1) == 0) else {} }}"

- name: Sammanfattning
  hosts: mongo_replica
  gather_facts: false
  run_once: true
  tasks:
    - name: Resultat per nod
      ansible.builtin.debug:
        msg: >-
          {{ item }}:
          {% if not hostvars[item].node_reachable %}VM:EN SVARAR INTE (hoppades över)
          {% elif not hostvars[item].node_running %}NERE (hoppades över)
          {% elif not hostvars[item].verify_result %}KUNDE INTE LÄSA (mongod svarar inte?)
          {% elif hostvars[item].verify_result.ok %}OK {{ 'PRIMARY' if hostvars[item].verify_result.isPrimary else 'SECONDARY' }} {{ hostvars[item].verify_result.counts }}
          {% else %}FEL {{ hostvars[item].verify_result.problems }}
          {% endif %}
      loop: "{{ groups['mongo_replica'] }}"

    - name: Minst en nod måste köra
      ansible.builtin.assert:
        that: (groups['mongo_replica'] | map('extract', hostvars, 'node_running') | select | list | length) > 0
        fail_msg: "Inga noder kör - det finns inget att verifiera. Starta klustret med: ansible-playbook playbooks/init_replica_set.yml"

    - name: Alla noder som kör ska ha komplett och korrekt data
      vars:
        running: "{{ groups['mongo_replica'] | map('extract', hostvars) | selectattr('node_running') | map(attribute='inventory_hostname') | list }}"
      ansible.builtin.assert:
        that:
          - groups['mongo_replica'] | map('extract', hostvars) | selectattr('node_running') | map(attribute='verify_result') | selectattr('ok', 'defined') | selectattr('ok') | list | length == running | length
        fail_msg: >-
          Testdatan är INTE komplett/korrekt på alla noder som kör - se raderna ovan.
          Verify förväntade sig {{ seed_docs_per_collection }} dokument per collection. Om du seedat ett annat
          antal måste du ange det: -e seed_docs_per_collection=<antal>
        success_msg: "Testdatan ligger kvar och är identisk på alla {{ running | length }} noder som kör."
