; De tre "noderna" är Docker-containrar. Ansible körs lokalt (ansible_connection=local) och
; hanterar varje container via `docker exec` - inventory_hostname = containernamn.
; host_port = porten på 127.0.0.1 i WSL som containern publiceras på (för mongosh utifrån).
[mongo_replica]
mongo-node-1 host_port=27017
mongo-node-2 host_port=27018
mongo-node-3 host_port=27019

[mongo_replica:vars]
ansible_connection=local
ansible_python_interpreter={{ ansible_playbook_python }}
